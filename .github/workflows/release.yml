name: Build and release macOS app

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check version and toolchain
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          swift --version
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/Explorer/Resources/Info.plist)
          if [[ "$REF_TYPE" == tag && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $VERSION" >&2
            exit 1
          fi
      - name: Run regression tests
        run: swift test --disable-xctest
      - name: Build universal release app
        run: bash script/package_release.sh --universal
      - name: Verify universal binary
        run: |
          lipo Explorer.app/Contents/MacOS/Explorer -verify_arch arm64
          lipo Explorer.app/Contents/MacOS/Explorer -verify_arch x86_64
          codesign --verify --strict --verbose=2 Explorer.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' Explorer.app/Contents/Info.plist)" = AppIcon
          cmp Sources/Explorer/Resources/AppIcon/AppIcon.icns Explorer.app/Contents/Resources/AppIcon.icns
          for LANGUAGE in en ru es; do
            for TABLE in Localizable.strings Localizable.stringsdict; do
              test -s "Explorer.app/Contents/Resources/Explorer_Explorer.bundle/$LANGUAGE.lproj/$TABLE"
            done
          done
          unzip -t dist/*.zip
      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Explorer-macos-universal
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Explorer $RELEASE_TAG" --notes-file RELEASE_NOTES.md
